<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventario - Productos</title>

  <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,700" rel="stylesheet" />

{% block home %}

{% endblock home %}

<!-- Contenedor para el modal (vacío al inicio) -->
<div id="popup" class="modal fade" tabindex="-1" role="dialog" aria-hidden="true"></div>

<!-- Modal de Confirmación -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content border-warning">
      <div class="modal-header bg-warning text-dark">
        <h5 class="modal-title">
          <i class="fas fa-exclamation-triangle"></i> Confirmar acción
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body" id="confirmModalBody">
        <!-- Texto dinámico -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-warning" id="confirmActionBtn">Aceptar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal de Error -->
<div class="modal fade" id="errorModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content border-danger">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title">
          <i class="fas fa-exclamation-triangle"></i> Error
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <!-- Aquí se muestra el mensaje de error -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Entendido</button>
      </div>
    </div>
  </div>
</div>
  
  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/StartBootstrap/startbootstrap-sb-admin-2/js/sb-admin-2.min.js"></script>

  <script>
    $(function () {
      // Inicializar DataTable
      $('#tabla').DataTable({
        responsive: true,
        language: { url: "https://cdn.datatables.net/plug-ins/1.13.4/i18n/es-ES.json" },
      });

      // Toggle sidebar y overlay al hacer click en hamburguesa
      $('#sidebarToggleTop').on('click', function (e) {
        e.preventDefault();
        $('#sidebarWrapper').toggleClass('active');
        $('#sidebarOverlay').toggleClass('show');
      });

      // Cerrar sidebar al hacer click en overlay
      $('#sidebarOverlay').on('click', function () {
        $('#sidebarWrapper').removeClass('active');
        $('#sidebarOverlay').removeClass('show');
      });

      // Cerrar sidebar si se hace click en un enlace no submenú y pantalla pequeña
      $('#sidebarWrapper').on('click', 'a.nav-link', function () {
        const isSubmenuToggle = $(this).attr('data-bs-toggle') === 'collapse';
        if (!isSubmenuToggle && window.innerWidth < 768) {
          $('#sidebarWrapper').removeClass('active');
          $('#sidebarOverlay').removeClass('show');
        }
      });

      // Opcional: cerrar sidebar automáticamente si se redimensiona a escritorio
      $(window).on("resize", function () {
        if (window.innerWidth >= 768) {
          $('#sidebarWrapper').removeClass('active');
          $('#sidebarOverlay').removeClass('show');
        }
      });
    });

// Variables globales para diferentes tipos de acciones
let selectedUserId = null;
let selectedModel = null;
let selectedObjId = null;
let selectedObjEstado = null;
let selectedObjName = null;
let selectedRowNumber = null;
let deleteModel = null;
let deleteObjId = null;
let deleteObjName = null;
let deleteRowNumber = null;

// Función para abrir el modal
function abrir_modal(btn) {
  const url = $(btn).data("url");
  $.ajax({
    url: url,
    type: 'get',
    dataType: 'json',
    success: function(data) {
      $("#popup").html(data.html_form);
      $("#popup").modal("show");
    }
  });
}

// Función para cerrar el modal
function cerrar_modal() {
  $("#popup").modal("hide");
}

// Captura el submit del formulario dentro del modal
$(document).on('submit', '#frm', function(e) {
  e.preventDefault();
  const frm = $(this);
  $.ajax({
    type: frm.attr('method'),
    url: frm.attr('action') || window.location.href,
    data: frm.serialize(),
    dataType: 'json',
    success: function(data) {
      if (data.success) {
        location.reload();
      } else {
        $("#popup").html(data.html_form);
      }
    },
    error: function(xhr, status, error) {
      alert("Error: " + error);
    }
  });
  return false;
});

// Función para activar/desactivar usuarios específicamente
function showConfirmModal(userId, currentStatus) {
  // Verificar si el usuario es administrador
  const userRole = '{{ user.rol }}';
  
  if (userRole !== 'Administrador') {
    // Si no es administrador, mostrar error directamente
    showErrorModal("No tienes permisos para realizar esta acción");
    return;
  }
  
  // Si es administrador, continuar con el modal de confirmación
  selectedUserId = userId;
  const message = currentStatus 
    ? "¿Estás seguro de que deseas desactivar este usuario?"
    : "¿Estás seguro de que deseas activar este usuario?";

  document.getElementById("confirmModalBody").innerText = message;
  const modal = new bootstrap.Modal(document.getElementById("confirmModal"));
  modal.show();
}

// Función genérica para activar/desactivar cualquier modelo
function showConfirmModalEstado(modelo, objId, currentStatus, objName, rowNumber) {
  selectedModel = modelo;
  selectedObjId = objId;
  selectedObjEstado = currentStatus;
  selectedObjName = objName;
  selectedRowNumber = rowNumber;

  const message = currentStatus
    ? `¿Estás seguro de que deseas desactivar este registro N°${rowNumber} de nombre ${objName}?`
    : `¿Estás seguro de que deseas activar este registro N°${rowNumber} de nombre ${objName}?`;

  document.getElementById("confirmModalBody").innerText = message;
  const modal = new bootstrap.Modal(document.getElementById("confirmModal"));
  modal.show();
}

// Función para eliminar con modal de confirmación
function showConfirmDeleteModal(modelo, objId, objName, rowNumber) {
  // Verificar si el usuario es administrador (esta variable debe ser pasada desde el template)
  const userRole = '{{ user.rol }}'; // Esto se debe pasar desde Django
  
  if (userRole !== 'Administrador') {
    // Si no es administrador, mostrar error directamente
    showErrorModal("No tienes permisos para realizar esta acción");
    return;
  }
  
  // Si es administrador, mostrar modal de confirmación
  deleteModel = modelo;
  deleteObjId = objId;
  deleteObjName = objName;
  deleteRowNumber = rowNumber;

  const message = `¿Estás seguro de que deseas eliminar N°${rowNumber} "${objName}"?`;
  document.getElementById("confirmModalBody").innerText = message;
  const modal = new bootstrap.Modal(document.getElementById("confirmModal"));
  modal.show();
}

// Funciones de ejecución
function toggleUsuarioActivo(userId) {
  fetch(`/usuarios/toggle/${userId}/`, {
    method: 'POST',
    headers: {
      'X-CSRFToken': getCookie('csrftoken'),
      'Content-Type': 'application/json'
    },
    credentials: 'same-origin'
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      location.reload();
    } else {
      showErrorModal(data.error || "Ocurrió un error.");
    }
  })
  .catch(error => {
    showErrorModal("Error de red o del servidor.");
  });
}

function confirmToggleEstado() {
  if (selectedModel && selectedObjId !== null) {
    fetch(`/toggle/${selectedModel}/${selectedObjId}/`, {
      method: 'POST',
      headers: {
        'X-CSRFToken': getCookie('csrftoken'),
        'Content-Type': 'application/json'
      },
      credentials: 'same-origin'
    })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        location.reload();
      } else {
        showErrorModal(data.error || "Ocurrió un error.");
      }
    })
    .catch(error => {
      showErrorModal("Error de red o del servidor.");
    });
  }
}

function confirmDelete() {
  if (deleteModel && deleteObjId !== null) {
    fetch(`/${deleteModel}/delete/${deleteObjId}/`, {
      method: 'POST',
      headers: {
        'X-CSRFToken': getCookie('csrftoken'),
        'Content-Type': 'application/json'
      },
      credentials: 'same-origin'
    })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        location.reload();
      } else {
        showErrorModal(data.error || "Ocurrió un error al eliminar.");
      }
    })
    .catch(error => {
      showErrorModal("Error de red o del servidor.");
    });
  }
}

// EVENT LISTENER UNIFICADO - Un solo addEventListener para todo
document.getElementById("confirmActionBtn").addEventListener("click", function () {
  // Si hay una acción de eliminar pendiente
  if (deleteModel && deleteObjId !== null) {
    confirmDelete();
    // Limpiar variables de eliminación
    deleteModel = null;
    deleteObjId = null;
    deleteObjName = null;
    deleteRowNumber = null;
  }
  // Si hay una acción de toggle estado pendiente
  else if (selectedModel && selectedObjId !== null) {
    confirmToggleEstado();
    // Limpiar variables de toggle
    selectedModel = null;
    selectedObjId = null;
    selectedObjEstado = null;
    selectedObjName = null;
    selectedRowNumber = null;
  }
  // Si hay una acción de usuario pendiente
  else if (selectedUserId !== null) {
    toggleUsuarioActivo(selectedUserId);
    selectedUserId = null;
  }
  
  bootstrap.Modal.getInstance(document.getElementById("confirmModal")).hide();
});

// Funciones auxiliares
function showErrorModal(message) {
  document.querySelector('#errorModal .modal-body').innerText = message;
  const modal = new bootstrap.Modal(document.getElementById("errorModal"));
  modal.show();
}

function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
  </script>





</body>
</html>
