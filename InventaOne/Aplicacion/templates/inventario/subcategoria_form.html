<div class="modal-dialog modal-lg">
  <div class="modal-content">
    <form id="frm" method="post" action="{{ request.path }}">
      <div class="col-xl-12 col-md-12 mb-12">
        <div class="card border-left-success shadow h-100 py-2">
          <div class="card-body">
            <div class="row no-gutters align-items-center">
              <div class="col mr-2">
                <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                  Nuevo  Subcategoria
                </div>
                <div class="dropdown-divider"></div>
                {% csrf_token %}
                <div class="row">
                  <!-- <div class="col-md-6 mb-3">
                    <label for="{{ form.username.id_for_label }}" class="form-label text-center w-300">Usuario</label>
                    {{ form.username }}
                    <div id="error_username" class="text-danger small"{% if not form.username.errors %} style="display:none;"{% endif %}>
                      {{ form.username.errors|striptags }}
                    </div>
                  </div> -->
                  
                 <div class="col-md-6 mb-3">
                    <label for="{{ form.nombre.id_for_label }}" class="form-label">Categoria</label>
                    {{ form.id_categoria }}
                    <div id="error_nombre" class="text-danger small"{% if not form.nombre.errors %} style="display:none;"{% endif %}>
                      {{ form.nombre.errors|striptags }}
                    </div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="{{ form.nombre.id_for_label }}" class="form-label">Nombre</label>
                    {{ form.nombre }}
                    <div id="error_nombre" class="text-danger small"{% if not form.nombre.errors %} style="display:none;"{% endif %}>
                      {{ form.nombre.errors|striptags }}
                    </div>
                  </div>
                 
                <div class="dropdown-divider"></div>
                <div class="row">
                  <div class="col">
                    <button type="submit" class="btn btn-danger">
                      <span class="fa fa-save"></span> Guardar
                    </button>
                    <button type="button" class="btn btn-success" onclick="cerrar_modal()">
                      Cancelar
                    </button>
                  </div>
                </div>
              </div>
              <div class="col-auto">
                <i class="far fa-calendar-plus fa-2x text-gray-300"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
