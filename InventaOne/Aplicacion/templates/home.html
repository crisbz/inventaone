{% extends 'base_file.html' %}

{% block home %}

{% include 'siderbar.html' %}
<!-- Contenido -->
<div id="content-wrapper" class="d-flex flex-column">
  <div id="content">
    <!-- Navbar -->
    <nav class="main-header navbar navbar-expand navbar-white navbar-light shadow-sm">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" id="sidebarToggleTop" href="#"><i class="fas fa-bars"></i></a>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="#">
            <span class="me-2 d-none d-lg-inline text-gray-600 small">usuario</span>
            <img class="img-profile rounded-circle" src="https://via.placeholder.com/40" alt="Avatar" />
          </a>
        </li>
        <li class="nav-item dropdown">
          <a href="#" class="nav-link dropdown-toggle" id="settingsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <img src="https://img.icons8.com/ios/50/000000/settings.png" width="19" height="19" alt="Settings">
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="settingsDropdown">
            <li>
              <a class="dropdown-item" href="#"><i class="fas fa-user-edit me-2"></i>Actualizar Perfil</a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <form id="logout-form" action="{% url 'Aplicacion:logout' %}" method="post" style="margin: 0;">
                {% csrf_token %}
                <button type="submit" class="dropdown-item" style="width: 100%; text-align: left;">
                  <i class="fas fa-power-off me-2"></i>Salir
                </button>
              </form>
            </li>
          </ul>
        </li>
      </ul>
    </nav>  

    <!-- Aquí abrimos un solo content-wrapper interno, sin repetir ids -->
    <div class="d-flex flex-column min-vh-1">
      <div id="content-inner">
        {% block page_content %}
        {% endblock page_content %}
      </div>

      <!-- Aquí puedes incluir el modal para errores -->
      {% include 'usuarios/modal.html' %}

      <!-- Footer -->
      <footer class="sticky-footer bg-white">
        <div class="container my-auto">
          <div class="text-center my-auto">© 2025 Sistema de Inventario</div>
        </div>
      </footer>
    </div> <!-- cierre div d-flex flex-column min-vh-1 -->

  </div> <!-- cierre div id content -->
</div> <!-- cierre div id content-wrapper -->

{% endblock home %}
